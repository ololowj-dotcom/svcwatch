name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest
      - name: Smoke-test the installed command
        run: |
          svcwatch --version
          svcwatch init /tmp/svcwatch.toml
          svcwatch check -c /tmp/svcwatch.toml || test $? -le 2

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck install.sh
      - name: Installer end to end (from this checkout)
        run: |
          sudo SVCWATCH_NO_SETUP=1 SVCWATCH_REPO="file://$GITHUB_WORKSPACE" SVCWATCH_REF="$GITHUB_SHA" bash install.sh
          svcwatch --version
