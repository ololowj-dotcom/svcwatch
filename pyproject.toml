[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "svcwatch"
version = "1.0.0"
description = "Lightweight watchdog for Linux services: systemd units, Docker containers, processes, HTTP and TCP endpoints. Alerts to Telegram, email or webhooks."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["monitoring", "systemd", "docker", "telegram", "watchdog", "alerts", "devops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
svcwatch = "svcwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "UP006", "UP007", "UP031", "UP035", "UP045", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
